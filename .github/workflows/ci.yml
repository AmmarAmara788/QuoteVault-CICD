name: quotvevault ci

"on":
  push:
    branches:
      - main

jobs:
  # 1. اختبارات الـ Unit
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Unit Tests
        run: pytest tests/unit/ # نحدد المجلد فقط

  # 2. اختبارات الـ API
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run API Tests
        run: pytest tests/api/ # نحدد المجلد فقط
